<title>Liftfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: four tabs (Statistik, Übungen, Profil, Optionen); bottom bar on phones, top bar on desktop.
   Look: clean fintech. One neutral canvas, big bold numbers, sentence-case labels.
   One signal colour (--c, user-chosen) for lines, highlights and controls; green only for gains.
   No outside benchmarks: every number compares you with your own past. */
:root{
  --bg:#FFFFFF; --surface:#F4F5F6; --ink:#0E1011; --ink-2:#4A4F55; --muted:#7A8087; --line:#E5E7EA; --grid:#EEF0F2;
  --c:var(--c-l,#138545); --on:var(--on-l,#ffffff); --glow:.18; --gsh:none;
  --good:#0F8A43; --bad:#C62E3B; --tip-bg:#0E1011; --tip-fg:#FFFFFF;
  --glass:color-mix(in srgb,var(--surface) 82%,transparent);
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#111314; --ink:#F2F4F5; --ink-2:#B9BEC3; --muted:#868C92; --line:#22262A; --grid:#16191B;
    --c:var(--c-d,#3ee07f); --on:var(--on-d,#000000); --glow:.6; --gsh:0 0 14px color-mix(in srgb,var(--c) 40%,transparent);
    --good:#3DDC84; --bad:#FF6B6B; --tip-bg:#F2F4F5; --tip-fg:#000000; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#111314; --ink:#F2F4F5; --ink-2:#B9BEC3; --muted:#868C92; --line:#22262A; --grid:#16191B;
  --c:var(--c-d,#3ee07f); --on:var(--on-d,#000000); --glow:.6; --gsh:0 0 14px color-mix(in srgb,var(--c) 40%,transparent);
  --good:#3DDC84; --bad:#FF6B6B; --tip-bg:#F2F4F5; --tip-fg:#000000; color-scheme:dark;
}
/* explicit choice in Optionen wins over system and host theme */
html:root.m-light{
  --bg:#FFFFFF; --surface:#F4F5F6; --ink:#0E1011; --ink-2:#4A4F55; --muted:#7A8087; --line:#E5E7EA; --grid:#EEF0F2;
  --c:var(--c-l,#138545); --on:var(--on-l,#ffffff); --glow:.18; --gsh:none;
  --good:#0F8A43; --bad:#C62E3B; --tip-bg:#0E1011; --tip-fg:#FFFFFF; color-scheme:light;
}
html:root.m-dark{
  --bg:#000000; --surface:#111314; --ink:#F2F4F5; --ink-2:#B9BEC3; --muted:#868C92; --line:#22262A; --grid:#16191B;
  --c:var(--c-d,#3ee07f); --on:var(--on-d,#000000); --glow:.6; --gsh:0 0 14px color-mix(in srgb,var(--c) 40%,transparent);
  --good:#3DDC84; --bad:#FF6B6B; --tip-bg:#F2F4F5; --tip-fg:#000000; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--f);-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.gut{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.lbl{font:600 13px/1.3 var(--f);color:var(--muted)}

/* header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid var(--line)}
.top .gut{display:flex;align-items:center;gap:16px;height:56px}
.brand{font:800 18px/1 var(--f);letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:9px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--surface)}
.tabs a[aria-current="page"] svg{color:var(--c)}
.sync{display:flex;align-items:center;gap:6px;font:600 12px var(--f);color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--bad)} .sync.busy i{background:var(--c)}
main.gut{display:grid;gap:36px;padding-block:28px 64px}
@media (max-width:760px){
  .top{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)} /* a filtered ancestor would trap the fixed tab bar */
  .top .gut{height:50px}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:9;background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border-top:1px solid var(--line);gap:0;
        padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs a{flex:1;flex-direction:column;justify-content:center;gap:4px;height:52px;padding:0;background:none!important}
  .tabs a span{display:none}
  .tabs svg{width:25px;height:25px}
  .tabs a::after{content:"";width:4px;height:4px;border-radius:2px;background:transparent}
  .tabs a[aria-current="page"]::after{background:var(--c)}
  .sync{margin-left:auto}.sync span{display:none}
  main.gut{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));gap:30px}
}

/* type */
h1{font:800 clamp(28px,6vw,36px)/1.1 var(--f);letter-spacing:-.025em;margin:0;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
h2{font:800 19px/1.25 var(--f);letter-spacing:-.015em;margin:0}
section{display:grid;gap:14px;min-width:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* controls */
.btn{height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--c);color:var(--on);border-color:var(--c);box-shadow:var(--gsh)}
.btn.warn{color:var(--bad)}
.btn.sm{height:34px;padding:0 13px;font-size:13px;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 13px;border-radius:16px;border:0;background:var(--surface);font:700 13px var(--f);cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg{display:inline-flex;border-radius:12px;padding:3px;gap:3px;background:var(--surface)}
.seg button{border:0;background:transparent;height:36px;padding:0 14px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-2);flex:1}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.field{display:grid;gap:5px;min-width:0}
.field>span{font:600 13px var(--f);color:var(--muted)}
input[type=text],input[type=date],input[type=search],select,textarea{height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font:600 16px var(--f);font-variant-numeric:tabular-nums;width:100%;min-width:0}
textarea{height:auto;min-height:90px;padding:10px 12px;font-size:12px;font-weight:500;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--c);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.step{display:flex;gap:4px}
.step button{width:48px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;font:600 20px var(--f);cursor:pointer;color:var(--ink-2)}

/* brand glyph */
.logo{width:26px;height:26px;border-radius:6.5px;background:var(--c);overflow:hidden;flex:none;display:block;box-shadow:var(--gsh)}
.logo svg{display:block;width:100%;height:100%}
.logo .b{fill:var(--on)}.logo .k{fill:var(--c)}.logo .s{stroke:var(--on)}
/* Einführung beim ersten Start – immer dunkel */
.bear .b{fill:var(--on)}.bear .k{fill:var(--c)}.bear .r{stroke:var(--c)}.bear .s{stroke:var(--on)}
.intro{--bg:#000000;--surface:#111314;--ink:#F2F4F5;--ink-2:#B9BEC3;--muted:#868C92;--line:#22262A;--grid:#16191B;--c:var(--c-d,#3ee07f);--on:var(--on-d,#000000);--glow:.6;--gsh:0 0 14px color-mix(in srgb,var(--c) 40%,transparent);color-scheme:dark;color:var(--ink);
  position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;display:flex;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.intro.bye{animation:outFade .22s ease-in both}
.intro-in{margin:auto;width:100%;max-width:420px;display:grid;gap:22px}
.intro-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;width:100%}
.intro-top .seg button{height:30px;padding:0 10px;font-size:13px}
.intro-skip{border:0;background:none;color:var(--muted);font:700 14px var(--f);cursor:pointer;padding:8px 0;transition:opacity .15s}
.intro-skip:active{opacity:.5}
.intro h1{font-size:clamp(40px,11vw,52px)}
.intro .lead{font:600 17px/1.55 var(--f);color:var(--ink-2);margin:0}
.intro .btn{height:52px;font-size:16px;border-radius:14px}
.intro-act{display:grid;gap:10px;width:100%}
.in2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hfi{display:flex;align-items:center;gap:6px}
.hfi input{flex:1;min-width:0;text-align:center;padding:0 6px}
.hfi span{font:700 13px var(--f);color:var(--muted)}
.s0{justify-items:center;text-align:center}
.s0 .lead{max-width:340px}
.hello{display:grid;justify-items:center;gap:16px;margin-top:6px}
.say{position:relative;background:var(--surface);font:800 30px/1 var(--f);letter-spacing:-.02em;padding:14px 22px 15px;border-radius:20px;transform-origin:50% 100%}
.say::after{content:"";position:absolute;left:50%;bottom:-7px;width:16px;height:16px;background:inherit;border-radius:3px;transform:translateX(-50%) rotate(45deg)}
.hero-logo{width:148px;height:148px;display:block;filter:drop-shadow(0 10px 32px color-mix(in srgb,var(--c) 30%,transparent))}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .35s cubic-bezier(.2,.8,.2,1),background-color .35s}
.dots i.on{width:22px;background:var(--c)}
.coach{display:flex;gap:12px;align-items:flex-end}
.logo.av{width:58px;height:58px;border-radius:16px}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border-radius:22px 22px 22px 6px;padding:18px 20px;font:600 17px/1.5 var(--f);transform-origin:0 100%}
.bubble b{font-weight:800}
.bubble span,.say span{transition:opacity .08s}
.intro .tw{opacity:0}
.ti{display:inline-flex;align-items:center;gap:5px;padding:1px 9px 1px 7px;border-radius:9px;background:var(--bg);color:var(--c);font-weight:800;white-space:nowrap;vertical-align:baseline}
.ti svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Übergänge */
.intro-in.enter{animation:inSlide .34s cubic-bezier(.2,.8,.2,1) both}
.intro-in.leave{animation:outSlide .17s ease-in both}
.intro-in.leave-tip .bubble,.intro-in.leave-tip .intro-act{animation:outFade .16s ease-in both}
.intro-in.enter .bubble,.intro-in.enter-tip .bubble{animation:bubblePop .4s .08s cubic-bezier(.2,1.25,.4,1) both}
.intro-in.enter-tip .intro-act{animation:inFade .3s .05s ease-out both}
.intro-in.enter-first{animation:inFade .3s ease-out both}
.s0.enter-first .hero-logo,.s0.enter .hero-logo{animation:logoIn .55s cubic-bezier(.2,1,.3,1) both}
.s0.enter-first .say,.s0.enter .say{animation:sayPop .5s .38s cubic-bezier(.2,1.4,.4,1) both}
.s0.enter-first .lead,.s0.enter .lead{animation:inFade .45s .6s ease-out both}
.s0.enter-first .intro-act,.s0.enter .intro-act{animation:inFade .45s .72s ease-out both}
@keyframes inFade{from{opacity:0;transform:translateY(10px)}}
@keyframes inSlide{from{opacity:0;transform:translateX(24px)}}
@keyframes outSlide{to{opacity:0;transform:translateX(-18px)}}
@keyframes outFade{to{opacity:0}}
@keyframes bubblePop{from{opacity:0;transform:scale(.92) translateY(6px)}}
@keyframes sayPop{from{opacity:0;transform:scale(.6) translateY(14px)}}
@keyframes logoIn{from{opacity:0;transform:scale(.86)}}
/* Knöpfe: sanft und mit leichtem Nachgeben beim Drücken */
.btn{transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .2s,border-color .2s,box-shadow .2s,color .2s}
.btn:active{transform:scale(.97)}
.seg button{transition:background-color .2s,color .2s,box-shadow .2s,transform .14s}
.seg button:active,.chip:active,.swatch:active,.opt:active{transform:scale(.97)}
.chip,.swatch,.opt{transition:background-color .2s,border-color .2s,color .2s,transform .14s}

/* gain pills */
.dp{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font:800 13px/1.3 var(--f);font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--surface);color:var(--ink-2)}
.dp.up{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.dp.xl{font-size:15px;padding:5px 11px}
.up{color:var(--good)}

/* goal bar */
.goal{position:relative;height:8px;border-radius:4px;background:color-mix(in srgb,var(--c) 16%,transparent)}
.goal i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c);box-shadow:var(--gsh)}
.goalends{display:flex;justify-content:space-between;font:700 12px var(--f);color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}

/* stats tab */
.demo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 6px 16px;border-radius:14px;background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.hi{font:800 clamp(30px,7vw,40px)/1.1 var(--f);letter-spacing:-.03em;margin:0}
.since{font:600 17px/1.55 var(--f);color:var(--ink-2);margin:0;max-width:60ch}
.since b{color:var(--ink);font-weight:800}
.since b.c{color:var(--c)}
.hero{display:grid;gap:16px}
.bigrow{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.heronum{font:800 clamp(48px,11vw,72px)/1 var(--f);letter-spacing:-.04em;color:var(--c);font-variant-numeric:tabular-nums;text-shadow:0 0 28px color-mix(in srgb,var(--c) calc(var(--glow) * 70%),transparent)}
.nextline{font:600 14px var(--f);color:var(--ink-2);margin:0}
.nextline b{color:var(--ink);font-weight:800}
.kpis3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border-radius:16px;padding:14px 16px;display:grid;gap:4px;align-content:start;min-width:0;border:1px solid transparent;text-align:left;font:inherit;color:inherit;cursor:pointer}
button.kpi:hover{border-color:var(--line)}
.kpi .kv{font:800 clamp(24px,5vw,32px)/1.05 var(--f);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .kv small{font-size:.5em;font-weight:700;color:var(--muted);margin-left:3px;letter-spacing:0}
.kpi .ks{font:600 12.5px var(--f);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.add{place-items:center;align-content:center;min-height:106px;background:transparent;border:1.5px dashed var(--line);color:var(--muted);font:300 42px/1 var(--f)}
.kpi.add:hover,.mc.addc:hover{border-color:var(--c);color:var(--c)}
@media (max-width:600px){.kpis3{grid-template-columns:1fr 1fr}.kpis3 .kpi:first-child{grid-column:1/-1}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.mc{display:grid;gap:6px;padding:14px 16px 12px;border-radius:18px;background:var(--surface);text-decoration:none;min-width:0;border:1px solid transparent}
a.mc:hover{border-color:var(--line)}
.mc.addc{place-items:center;align-content:center;min-height:168px;background:transparent;border:1.5px dashed var(--line);color:var(--muted);font:300 46px/1 var(--f);cursor:pointer}
.mc.edit{position:relative;touch-action:none;cursor:grab;border:1.5px dashed color-mix(in srgb,var(--c) 50%,var(--line));user-select:none;-webkit-user-select:none}
.mc.edit .chart{pointer-events:none}
.mc.dragging{opacity:.9;box-shadow:0 14px 34px rgba(0,0,0,.28);transform:scale(1.02);z-index:2;cursor:grabbing}
.mc .rm{position:absolute;top:-9px;right:-9px;width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);background:var(--ink);color:var(--bg);font:800 11px var(--f);cursor:pointer;z-index:3}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.mn{font-weight:700;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv{font:800 30px/1 var(--f);letter-spacing:-.03em;white-space:nowrap;font-variant-numeric:tabular-nums}
.mv small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;letter-spacing:0}
.ms{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.ms .t{font:600 12.5px var(--f);color:var(--muted)}
.hint{font:600 12.5px var(--f);color:var(--muted);align-self:center}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.sheet{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));max-height:min(80vh,640px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
@media (max-width:760px){.sheet{left:0;right:0;bottom:0;top:auto;transform:none;width:auto;max-height:80vh;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet .x{width:36px;height:36px;flex:none;border-radius:10px;border:0;background:var(--surface);cursor:pointer;font-size:14px;color:var(--ink-2)}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:10px 14px;border-radius:14px;border:1px solid transparent;background:var(--surface);cursor:pointer;text-align:left;font:700 15px var(--f)}
.opt .v{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.opt[aria-pressed="true"]{border-color:var(--c)}
.opt:disabled{opacity:.4;cursor:default}

/* charts */
.chart{position:relative;min-width:0;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font:600 11px var(--f);fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .vl{fill:var(--ink);font-weight:800;font-size:12.5px;paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.chart .bt{font-weight:800;font-size:10.5px}
.mini{height:84px}
.tip{position:absolute;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font:600 12.5px/1.45 var(--f);font-variant-numeric:tabular-nums;padding:7px 10px;border-radius:10px;white-space:nowrap;z-index:3;opacity:0;transition:opacity .08s}
.tip b{font-weight:600;opacity:.65;display:block;font-size:11.5px}
.nodata{height:110px;display:grid;place-items:center;color:var(--muted);font-size:13.5px;font-weight:600;background:var(--surface);border-radius:16px}
.nodata.mini{height:84px;background:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.sw.hollow{background:transparent;border:1.75px solid var(--muted)}

/* exercises tab */
.res{display:grid}
.ri{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none}
.ri .n{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri .r{display:flex;align-items:center;gap:10px;font:800 15px var(--f);font-variant-numeric:tabular-nums;flex:none}
.ri .plus{color:var(--muted);font:500 22px var(--f)}
.newex{background:var(--surface);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.newex .field{width:150px}
.newex .field.grow{flex:1 1 220px;width:auto}
.newex input,.newex select{background:var(--bg)}
.back{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;margin-left:-10px;border-radius:12px;text-decoration:none;font-size:22px;color:var(--ink-2)}
.back:hover{background:var(--surface)}
.exh{display:flex;align-items:center;gap:6px;min-width:0}
.exhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:32px;align-items:start}
@media (max-width:820px){.exhero{grid-template-columns:1fr;gap:22px}}
.exstat{display:grid;gap:12px}
.e1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.e1 .big{font:800 clamp(56px,13vw,84px)/.95 var(--f);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.e1 .u{font:800 22px var(--f);color:var(--muted);letter-spacing:-.01em}
.card{background:var(--surface);border-radius:20px;padding:16px;display:grid;gap:12px}
.card .seg{display:flex;background:var(--bg)}
.card .seg button[aria-pressed="true"]{background:var(--surface)}
.card input[type=text],.card input[type=date],.card .step button{background:var(--bg)}
.fgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,.8fr);gap:8px}
.fgrid .full{grid-column:1/-1}
.prev{font:600 13px var(--f);color:var(--muted);min-height:20px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.st{background:var(--surface);border-radius:16px;padding:12px 14px;min-width:0;display:grid;gap:4px}
.st .v{font:800 20px/1.1 var(--f);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.log{display:grid}
.lg{display:grid;grid-template-columns:76px minmax(0,1fr) auto 40px;gap:10px;align-items:center;min-height:48px;border-bottom:1px solid var(--line);font:700 14.5px var(--f);font-variant-numeric:tabular-nums}
.lg .dt{font-size:12.5px;font-weight:600;color:var(--muted)}
.lg .e{font-size:12.5px;font-weight:600;color:var(--muted)}
.lg .x{border:0;background:transparent;color:var(--muted);cursor:pointer;height:32px;border-radius:9px;font:700 12px var(--f)}
.lg .x:hover{color:var(--bad)}
.lg .x.c{color:var(--bad);border:1px solid var(--bad);padding:0 6px}
.lg.c{grid-template-columns:76px minmax(0,1fr) auto auto}

/* profile + options */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pgrid .span2{grid-column:1/-1}
.prow{display:flex;gap:8px;align-items:end}
.bwf{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) auto;gap:8px;align-items:end;max-width:460px}
.prow .field{width:150px}
.seg.wide{display:flex;max-width:440px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:8px}
.swatch{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;border:1px solid transparent;background:var(--surface);cursor:pointer;font-weight:700;font-size:14px;color:var(--ink-2);text-align:left}
.swatch i{width:16px;height:16px;border-radius:50%;flex:none}
.swatch[aria-pressed="true"]{color:var(--ink);border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.foot{font-size:12.5px;font-weight:600;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:20;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){.toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.priv summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;padding:6px 0}
.priv p{margin-top:6px}
/* native App: kein Markieren/Antippen-Blitz wie im Browser */
html.native{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html.native body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.native input,html.native textarea{-webkit-user-select:text;user-select:text}

  if (at.getTime() < Date.now() + 36e5){ const d = new Date(); at.setTime(new Date(d.getFullYear(), d.getMonth(), d.getDate() + (d.getHours() < 17 ? 0 : 1), 18, 0, 0).getTime()); }
  const days = Math.max(n, Math.round((new Date(at.getFullYear(), at.getMonth(), at.getDate()) - base) / DAY));

}

function exCard(A, x0, now, bkey){
  const id = A.ex.id, pts = A.series.filter(d => d.dn >= x0).map(d => ({x:d.dn, y:d.run})), b = baseOf(A, x0);
  const dl = b ? A.best - b.v : 0, dp = b && b.v > 0 ? dl / b.v * 100 : 0;
  CHARTS['m-' + id] = {type:'line', mini:true, pts, x0, x1:now, base: b ? b.v : null, strip: weeklyStrip(A)};
  return miniCard(esc(exName(A.ex)), f1(A.best), unitOf(A.ex), `<span class="t">${pct(dp)}</span>${pill(dl, unitOf(A.ex))}`, 'm-' + id, '#ex-' + id, bkey);
}
let STATS = null, BOARD = {shown:[], avail:[]};
function statsCtx(){
  const now = dnum(today()), As = trackedIds().map(analyze);
  const first = Math.min(...As.map(A => A.series[0].dn));
  const x0 = S.range ? now - S.range : first;
  const weeks = []; for (let ws = weekStart(Math.max(first, x0)); ws <= now; ws += 7) weeks.push(ws);
  // Kraft-Index: Mittel aller Übungen aus Bestwert ÷ Bestwert zu Beginn des Zeitraums (jede Übung zählt gleich)
  const bases = As.map(A => ({A, b: baseOf(A, x0)})).filter(o => o.b && o.b.v > 0);
  const idxAt = de => { let s = 0, n = 0; for (const {A, b} of bases){ if (b.dn > de) continue; const r = runningBestAt(A, de); if (r == null) continue; s += r / b.v; n++; } return n ? (s / n - 1) * 100 : null; };
  const idxPts = []; for (const ws of weeks){ const de = Math.min(ws + 6, now), v = idxAt(de); if (v != null) idxPts.push({x:de, y:v}); }
  const gain = idxPts.length ? idxPts[idxPts.length-1].y : 0;
  // Gewinn seit dem allerersten Eintrag, für den Begrüßungssatz
  let ga = 0, gn = 0; for (const A of As){ const b0 = A.series[0].best; if (b0 > 0){ ga += A.best / b0; gn++; } }
  const gainAll = gn ? (ga / gn - 1) * 100 : 0;
  let top = null; for (const {A, b} of bases){ const p = (A.best / b.v - 1) * 100; if (!top || p > top.p) top = {A, p}; }
  // Gesamtkraft: Summe der Bestwerte aller Gewichtsübungen und Zuwachs gegenüber Zeitraumbeginn
  let total = 0, totalDelta = 0; for (const {A, b} of bases) if (kindOf(A.ex) === 'w'){ total += A.best; totalDelta += A.best - b.v; }
  let prN = 0, prLast = null;
  for (const A of As) for (const dn of A.prs) if (dn >= x0){ prN++; if (!prLast || dn > prLast.dn) prLast = {dn, ex:A.ex}; }
  const big = ['bench','squat','deadlift'].map(id => (S.logs[id] || []).length ? analyze(id) : null), bigPts = [];
  let bigTot = null;
  if (big.every(Boolean)){
    for (const ws of weeks){ const de = Math.min(ws + 6, now); const v = big.map(A => runningBestAt(A, de)); if (v.every(x => x != null)) bigPts.push({x:de, y:v.reduce((a,b) => a + b, 0)}); }
    if (bigPts.length) bigTot = big.reduce((a,A) => a + A.best, 0);
  }
  const dayMap = new Map(); for (const A of As) for (const d of A.series) dayMap.set(d.dn, (dayMap.get(d.dn) || 0) + d.vol);
  const full = weeks.filter(ws => ws + 6 < now);
  const vol = full.map(ws => { let v = 0; for (const [d, x] of dayMap) if (d >= ws && d < ws + 7) v += x; return {x:ws, y:v}; });
  const ses = full.map(ws => { let n = 0; for (const d of dayMap.keys()) if (d >= ws && d < ws + 7) n++; return {x:ws, y:n}; });
  const wk = new Map(); for (const d of dayMap.keys()){ const w = weekStart(d); wk.set(w, (wk.get(w) || 0) + 1); }
  let ws = weekStart(now); if (!wk.has(ws)) ws -= 7; let streak = 0; while (wk.has(ws)) { streak++; ws -= 7; }
  const inR = [...dayMap].filter(([d]) => d >= x0), daysIn = inR.length, volIn = inR.reduce((a, [, v]) => a + v, 0);
  const nWeeks = Math.max(1, (now - Math.max(first, x0) + 1) / 7);
  return {now, As, first, x0, weeks, idxPts, gain, gainAll, top, total, totalDelta, prN, prLast, bigPts, bigTot, full, vol, ses, streak, daysIn, volIn, nWeeks,
    sessStrip: dn => { const n = wk.get(weekStart(dn)) || 0; return n ? Math.min(1, .2 + n * .2) : 0; },
    bws: S.profile.bw.filter(b => dnum(b.d) >= x0), rLbl: t('r' + S.range)};
}

  const sub = ac.createOscillator(); sub.type = 'triangle'; sub.frequency.setValueAtTime(f0 / 2, t0);
  const fa = ac.createBiquadFilter(); fa.type = 'bandpass'; fa.frequency.value = v[0] * .78; fa.Q.value = 3.2;
  const fb = ac.createBiquadFilter(); fb.type = 'bandpass'; fb.frequency.value = v[1] * .74; fb.Q.value = 5.5;

  const gd = ac.createGain(); gd.gain.value = .1; // etwas direkter „Brumm“-Anteil

  const env = ac.createGain(); env.gain.setValueAtTime(.0001, t0); env.gain.exponentialRampToValueAtTime(1, t0 + .014); env.gain.exponentialRampToValueAtTime(.0001, t0 + dur);

let TW = null;
function twStop(finish){ if (!TW) return; clearTimeout(TW.timer); if (finish) TW.units.forEach(u => u.classList.remove('tw')); TW = null; }
function typewrite(el, delay){
  twStop(true);

  const units = [];
  const walk = node => {
    for (const ch of [...node.childNodes]){
      if (ch.nodeType === 3){
        const frag = document.createDocumentFragment();
        for (const c of ch.textContent){ const sp = document.createElement('span'); sp.className = 'tw'; sp.textContent = c; frag.appendChild(sp); units.push(sp); }
        ch.replaceWith(frag);
      } else if (ch.nodeType === 1){ if (ch.classList.contains('ti')){ ch.classList.add('tw'); units.push(ch); } else walk(ch); }
    }
  };
  walk(el);

    if (!TW) return;
    if (i >= units.length){ TW = null; return; }
    const u = units[i++], chip = u.classList.contains('ti'), c = chip ? 'o' : u.textContent;
    u.classList.remove('tw');
    const now = performance.now();
    if ((chip || /[aeiouäöüy]/i.test(c)) && now - lastG > 58){ lastG = now; grunt(c); talkHaptic(); }
    TW.timer = setTimeout(step, /[.!?]/.test(c) ? 160 : c === ',' || c === ':' ? 80 : chip ? 70 : 18);
  };

}

let introBusy = false, introPrev = null;
function renderIntro(){
  const box = $('#intro'); if (!box) return;
  if (!S.intro){
    twStop(false);
    if (box.innerHTML && !box.classList.contains('bye')){ box.classList.add('bye'); setTimeout(() => { if (!S.intro){ box.innerHTML = ''; box.className = ''; box.removeAttribute('role'); box.dataset.key = ''; introPrev = null; } }, 230); }
    return;
  }
  const key = S.intro.step + ':' + S.intro.tip + ':' + LI + ':' + S.opt.unit;
  if (box.dataset.key === key && box.innerHTML && !box.classList.contains('bye')) return;
  const prev = introPrev, cur = {step: S.intro.step, tip: S.intro.tip}; introPrev = cur;
  const moved = !!(prev && box.innerHTML && !box.classList.contains('bye') && (prev.step !== cur.step || prev.tip !== cur.tip));
  const sameStep = moved && prev.step === cur.step;
  const swap = () => {
    twStop(false);
    const keep = {}; box.querySelectorAll('input').forEach(i => { keep[i.id] = i.value; });
    box.dataset.key = key; box.className = 'intro'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-labelledby', 'intro-h');
    box.innerHTML = viewIntro();
    const inner = box.querySelector('.intro-in');
    if (inner) inner.classList.add(!prev ? 'enter-first' : moved ? (sameStep ? 'enter-tip' : 'enter') : 'still');
    for (const id in keep){ const el = document.getElementById(id); if (el) el.value = keep[id]; }
    // Fortschrittspunkte gleiten vom alten zum neuen Schritt
    const glide = (sel, from, to) => {
      const ds = [...box.querySelectorAll(sel + ' i')]; ds.forEach((d, i) => d.classList.toggle('on', i === from));
      if (from !== to) requestAnimationFrame(() => requestAnimationFrame(() => ds.forEach((d, i) => d.classList.toggle('on', i === to))));
    };
    glide('.dots.prog', prev ? prev.step : cur.step, cur.step);
    if (cur.step === 2) glide('.dots.tips', prev && prev.step === 2 ? prev.tip : cur.tip, cur.tip);
    if (moved) box.scrollTop = 0;
    introBusy = false;
    // Der Bär „spricht“: Begrüßung und Tipps erscheinen Buchstabe für Buchstabe
    if (cur.step === 0 && (!prev || moved)) typewrite(box.querySelector('.say'), 560);
    if (cur.step === 2 && (!prev || moved)) typewrite(box.querySelector('.bubble'), sameStep ? 200 : 300);
  };
  if (moved){ introBusy = true; const old = box.querySelector('.intro-in'); if (old) old.classList.add(sameStep ? 'leave-tip' : 'leave'); setTimeout(swap, 170); }
  else swap();
}

function nice(min, max, count){
  if (max - min < 1e-9) max = min + 1;
  const raw = (max - min) / count; let st = Math.pow(10, Math.floor(Math.log10(raw))); const e = raw / st;

  for (let v = lo; v <= hi + st/2; v += st) ticks.push(+v.toFixed(6));
  return {lo, hi, ticks};
}

  const W = el.clientWidth, w = tp.offsetWidth, h = tp.offsetHeight;

  let top = y - h - 12; if (top < -8) top = y + 14; tp.style.top = top + 'px';

    g += `<path d="${rec.map((r, i) => (i ? 'L' : 'M') + X(r.r).toFixed(1) + ',' + Y(r.proj).toFixed(1)).join('')}" fill="none" stroke="var(--muted)" stroke-width="1.25" stroke-dasharray="3 3"/>`;
    let seg = '', pen = false;
    rec.forEach(r => { if (r.best){ seg += (pen ? 'L' : 'M') + X(r.r).toFixed(1) + ',' + Y(r.w).toFixed(1); pen = true; } else pen = false; });
    if (seg) g += `<path d="${seg}" fill="none" style="stroke:var(--c);stroke-opacity:var(--glow)" stroke-width="6" stroke-linecap="round" filter="url(#sb-glow)"/><path d="${seg}" fill="none" style="stroke:var(--c)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>`;
    rec.forEach(r => {
      g += `<text x="${X(r.r)}" y="${H - 6}" text-anchor="middle">${r.r}</text>`;
      g += `<circle cx="${X(r.r)}" cy="${Y(r.proj)}" r="3.5" fill="var(--bg)" stroke="var(--muted)" stroke-width="1.5"/>`;
      if (r.best) g += `<circle cx="${X(r.r)}" cy="${Y(r.w)}" r="4.25" style="fill:var(--c)" stroke="var(--bg)" stroke-width="2"/>`;
      g += `<rect class="hb" data-r="${r.r}" x="${m.l + step * (r.r - 1)}" y="${m.t}" width="${step}" height="${ph}" fill="transparent"/>`;
    });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${t('rep_rec')}">${g}</svg>`;
    const svg = el.querySelector('svg'), tp = tipLayer(el);
    const show = ev => { const h = ev.target.closest('.hb'); if (!h) return; const r = rec[+h.dataset.r - 1], bb = svg.getBoundingClientRect();
      placeTip(el, tp, X(r.r) * bb.width / W, Y(Math.max(r.proj, r.best ? r.w : 0)) * bb.height / H, `<b>${r.r} ${t('reps')}</b>${r.best ? `${f1(r.w)} ${WU()} · ${dNum(dnum(r.best.d))}` : t('no_set')}<br>${t('projected')} ${f1(r.proj)} kg`); };
    svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', () => tp.style.opacity = 0);
  }
};

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  if (ev.target.classList && ev.target.classList.contains('sheet-bg')){ S.sheet = null; render(); return; }
  if (ev.target.closest && ev.target.closest('label')) return;
  if (TW && ev.target.closest && ev.target.closest('.bubble, .say')){ twStop(true); return; }
  const el = ev.target.closest('button, a');
  if (!el){ if (S.confirm){ S.confirm = null; render(); } return; }
  const d = el.dataset;
  if (d.intro){
    ev.preventDefault(); if (introBusy) return; audioCtx();
    if (TW && (d.intro === 'tip' || d.intro === 'first' || d.intro === 'stats')){ twStop(true); return; }
    if (d.intro === 'next' || d.intro === 'tip') haptic('tap');
    if (d.intro === 'next') S.intro = {step:1, tip:0};
    else if (d.intro === 'tip') S.intro = {step:2, tip:S.intro.tip + 1};
    else if (d.intro === 'replay') S.intro = {step:0, tip:0};
    else if (d.intro === 'skip' || d.intro === 'stats') return introDone('stats');
    else if (d.intro === 'first') return introDone('uebungen');
    render(); return;
  }
  if (d.mode){ setOpt({mode: d.mode}); return; }
  if (d.color){ setOpt({color: d.color}); return; }
  if (d.lang){ setOpt({lang: d.lang}); return; }
  if (d.unit){ setOpt({unit: d.unit}); return; }
  if (d.remind !== undefined){ setRemind(+d.remind); return; }
  if (d.kpi !== undefined){ S.sheet = {type:'kpi', slot:+d.kpi}; render(); return; }
  if (d.pick){ const k = S.profile.kpis.slice(); k[S.sheet.slot] = d.pick; S.profile.kpis = k; S.sheet = null; saveProfile(); render(); return; }
  if (d.pin){ saveBoard(BOARD.shown.concat([d.pin])); S.sheet = null; render(); return; }
  if (d.rm){ saveBoard(BOARD.shown.filter(k => k !== d.rm)); render(); return; }
  if (d.group !== undefined){ S.group = d.group; document.querySelectorAll('[data-group]').forEach(b => b.setAttribute('aria-pressed', b.dataset.group === S.group)); $('#results').innerHTML = resultsHTML(); return; }
  if (d.kind !== undefined){
    S.kind[S.exId] = +d.kind; const keepW = ($('#f-w') || {}).value; render();
    if ($('#f-w') && keepW != null) $('#f-w').value = keepW;
    if (+d.kind === 0 && $('#f-r') && !$('#f-r').value){ const arr = (S.logs[S.exId] || []).filter(e => !e.t), last = arr[arr.length-1]; $('#f-r').value = last ? last.r : ''; $('#f-s').value = last ? (last.s || 1) : 1; }
    updatePreview(); return;
  }
  if (d.step){ const f = $('#f-w'), cur = num(f.value) || 0, nv = Math.max(kindOf(exById(S.exId)) === 'bw' ? -200 : 0, Math.round((cur + +d.step) * 4) / 4); f.value = LI ? String(nv) : String(nv).replace('.', ','); updatePreview(); return; }
  if (d.range !== undefined){ S.range = +d.range; try { localStorage.setItem('satzbuch-range', S.range); } catch(e) {} render(); return; }
  if (d.del){ if (S.confirm !== d.del){ S.confirm = d.del; render(); return; } const id = S.exId; S.logs[id] = (S.logs[id] || []).filter(e => e.i !== d.del); S.confirm = null; saveLog(id); render(); toast(t('t_removed')); return; }
  if (d.bwdel){ const k = 'bw' + d.bwdel; if (S.confirm !== k){ S.confirm = k; render(); return; } S.profile.bw = S.profile.bw.filter(b => b.d !== d.bwdel); S.confirm = null; saveProfile(); render(); return; }
  const act = d.act;
  if (!act){ if (S.confirm && el.tagName === 'BUTTON') S.confirm = null; return; }
  ev.preventDefault();
  if (act === 'more'){ S.logMore = true; render(); return; }
  if (act === 'bwmore'){ S.bwMore = true; render(); return; }
  if (act === 'board-edit'){ S.boardEdit = !S.boardEdit; render(); return; }
  if (act === 'board-add'){ S.sheet = {type:'board'}; render(); return; }
  if (act === 'sheet-close'){ S.sheet = null; render(); return; }
  if (act === 'kpi-clear'){ const k = S.profile.kpis.slice(); k[S.sheet.slot] = null; S.profile.kpis = k; S.sheet = null; saveProfile(); render(); return; }
  if (act === 'show-import'){ S.showImport = !S.showImport; render(); return; }
  if (act === 'create-open'){ S.creating = true; $('#create').innerHTML = createHTML(); const n = $('#c-n'); if (n) n.focus(); return; }
  if (act === 'create-cancel'){ S.creating = false; $('#create').innerHTML = createHTML(); return; }
  if (act === 'create'){
    const n = ($('#c-n').value || '').trim().slice(0, 60); if (!n){ toast(t('t_name')); $('#c-n').focus(); return; }
    const slug = norm(n).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24) || 'uebung';
    const id = 'c-' + slug + '-' + Math.random().toString(36).slice(2, 6);
    S.profile.custom = (S.profile.custom || []).concat([{id, n, g: $('#c-g').value, k: $('#c-k').value}]);
    saveProfile(); S.q = ''; S.creating = false; location.hash = 'ex-' + id; toast(t('t_created')); return;
  }
  if (act === 'del-ex'){
    if (S.confirm !== 'del-ex'){ S.confirm = 'del-ex'; render(); return; }
    const id = S.exId; S.profile.custom = S.profile.custom.filter(c => c.id !== id); if (S.profile.board) S.profile.board = S.profile.board.filter(k => k !== 'ex:' + id); delete S.logs[id]; S.confirm = null; saveLog(id); saveProfile(); location.hash = 'uebungen'; toast(t('t_deleted')); return;
  }
  if (act === 'demo-off'){
    if (S.confirm !== 'demo-off'){ S.confirm = 'demo-off'; render(); return; }
    S.confirm = null;
    for (const id of Object.keys(S.logs)){ const before = S.logs[id].length; S.logs[id] = S.logs[id].filter(e => !isDemo(e)); if (S.logs[id].length !== before) saveLog(id); }
    S.profile.bw = S.profile.bw.filter(b => !b.x); S.profile.demo = false; saveProfile(); render(); toast(t('t_demo')); return;
  }
  if (act === 'wipe'){
    if (S.confirm !== 'wipe'){ S.confirm = 'wipe'; render(); return; }
    S.confirm = null; for (const id of Object.keys(S.logs)){ S.logs[id] = []; saveLog(id); }
    const p = S.profile; S.logs = {}; S.profile = normProfile({name: p.name, height: p.height, born: p.born, by: p.by, opt: p.opt, kpis: p.kpis, custom: p.custom}); saveProfile(); render(); toast(t('t_deleted')); return;
  }
  if (act === 'export'){
    const json = JSON.stringify({v:1, profile:S.profile, logs:S.logs}), ta = $('#exp');
    if (NP('Filesystem') && NP('Share')){
      NP('Filesystem').writeFile({path:'liftfolio-' + today() + '.json', directory:'CACHE', data:json, encoding:'utf8'})
        .then(r => NP('Share').share({title:'Liftfolio Export', files:[r.uri]}))
        .catch(e => { if (!/cancel/i.test(String(e && (e.message || e)))) { ta.value = json; ta.hidden = false; ta.focus(); ta.select(); toast(t('t_select')); } });
      return;
    }
    ta.value = json; ta.hidden = false;
    const fallback = () => { ta.focus(); ta.select(); toast(t('t_select')); };
    try { navigator.clipboard.writeText(json).then(() => toast(t('t_copied')), fallback); } catch(e) { fallback(); }
    return;
  }
  if (act === 'import'){
    let data; try { data = JSON.parse($('#imp').value); } catch(e) { toast(t('t_json')); return; }
    if (!data || typeof data.logs !== 'object'){ toast(t('t_format')); return; }
    if (S.confirm !== 'import'){ S.confirm = 'import'; render(); return; }
    S.confirm = null; const old = Object.keys(S.logs); S.logs = {};
    for (const [k, v] of Object.entries(data.logs)) if (Array.isArray(v) && /^[A-Za-z0-9-]+$/.test(k)) S.logs[k] = v.filter(e => e && e.d && isFinite(+e.w)).map(e => ({i: String(e.i || uid()), d: String(e.d).slice(0, 10), w: +e.w, r: +e.r || 1, s: +e.s || 1, t: e.t ? 1 : 0}));
    for (const id of new Set(old.concat(Object.keys(S.logs)))) saveLog(id);
    adoptProfile(data.profile); saveProfile(); S.showImport = false; render(); toast(t('t_imported')); scheduleRemind(); return;
  }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'q'){ S.q = el.value; $('#results').innerHTML = resultsHTML(); return; }
  if (el.id && el.id.startsWith('f-')) updatePreview();
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'imp-file'){
    const file = ev.target.files && ev.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => { const ta = $('#imp'); if (ta) { ta.value = String(rd.result || ''); S.confirm = null; toast(t('t_file')); } };
    rd.readAsText(file); return;
  }
  const el = ev.target, f = el.dataset && el.dataset.pf; if (!f) return;
  const v = el.value.trim();
  if (f === 'name') S.profile.name = v.slice(0, 40);
  if (f === 'height'){ const cm = hRead('p'); if (cm === '') S.profile.height = null; else if (cm != null) S.profile.height = cm; else { toast(hRange()); return; } }
  if (f === 'born'){ if (v === '') S.profile.born = null; else if (/^\d{4}-\d{2}-\d{2}$/.test(v) && v >= '1920-01-01' && v <= today()) { S.profile.born = v; S.profile.by = null; } else { toast(t('t_date')); return; } }
  saveProfile(); render();
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'introform'){ introSave(); return; }
  if (ev.target.id === 'entry'){
    const {ex, kind, w, r, s, d} = readForm(), id = S.exId;
    if (!isFinite(w) || (kindOf(ex) === 'w' && w <= 0)){ toast(t('t_w')); $('#f-w').focus(); return; }
    if (!kind && !(r >= 1 && r <= 100)){ toast(t('t_r')); $('#f-r').focus(); return; }
    if (!(s >= 1 && s <= 30)){ toast(t('t_s')); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)){ toast(t('t_d')); return; }
    const A = analyze(id), prev = A.best, wasNew = !(S.logs[id] || []).length;
    const e = {i: uid(), d, w: Math.round(w * 100) / 100, r: kind ? 1 : r, s: kind ? 1 : s, t: kind ? 1 : 0}, m = metric(e, ex);
    S.logs[id] = (S.logs[id] || []).concat([e]); saveLog(id);
    if (wasNew && S.profile.board && !S.profile.board.includes('ex:' + id)){ S.profile.board = S.profile.board.concat(['ex:' + id]); saveProfile(); }
    let msg = t('t_logged'), pr = false;
    if (prev != null && m > prev + 1e-9){
      const g = nextGoal(prev, kindOf(ex) === 'bw'); pr = true;
      msg = m >= g.goal - 1e-9 ? t('t_goal', {v: f1(g.goal) + ' ' + unitOf(ex)}) : t('t_pr', {v: f1(m) + ' ' + unitOf(ex)});
    }
    render(); toast(msg); haptic(pr ? 'pr' : 'tap'); scheduleRemind(); return;
  }
  if (ev.target.id === 'bwform'){
    const w = bwToKg(num($('#p-bw').value)), d = ($('#p-bwd') || {}).value || today();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d > today() || d < '1920-01-01'){ toast(t('t_date')); return; }
    if (w == null){ toast(bwRange()); return; }
    S.profile.bw = S.profile.bw.filter(b => b.d !== d).concat([{d, w}]).sort((a,b) => a.d < b.d ? -1 : 1);
    saveProfile(); $('#p-bw').value = ''; render(); toast(t('t_saved')); return;
  }
});
// Pinnwand sortieren: Karte ziehen (Maus/Touch) oder Pfeiltasten
document.addEventListener('pointerdown', ev => {
  if (!S.boardEdit || ev.button > 0) return;
  const card = ev.target.closest('.mc.edit'); if (!card || ev.target.closest('button')) return;
  drag = {el: card, grid: card.parentElement, id: ev.pointerId};
  try { card.setPointerCapture(ev.pointerId); } catch(e) {}
  card.classList.add('dragging');
});
document.addEventListener('pointermove', ev => {
  if (!drag || ev.pointerId !== drag.id) return;
  ev.preventDefault();
  if (ev.clientY < 70) window.scrollBy(0, -10); else if (ev.clientY > innerHeight - 110) window.scrollBy(0, 10);
  const under = document.elementFromPoint(ev.clientX, ev.clientY), tgt = under && under.closest('.mc.edit');
  if (!tgt || tgt === drag.el || tgt.parentElement !== drag.grid) return;
  const items = [...drag.grid.querySelectorAll('.mc.edit')], a = items.indexOf(drag.el), b = items.indexOf(tgt);
  drag.grid.insertBefore(drag.el, a < b ? tgt.nextSibling : tgt);
}, {passive:false});
const endDrag = ev => {
  if (!drag || ev.pointerId !== drag.id) return;
  drag.el.classList.remove('dragging');
  const keys = [...drag.grid.querySelectorAll('[data-bkey]')].map(e => e.dataset.bkey), changed = keys.join() !== BOARD.shown.join();
  drag = null;
  if (changed){ saveBoard(keys); BOARD.shown = keys; }
  if (renderPending || changed){ renderPending = false; render(); }
};
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.sheet){ S.sheet = null; render(); return; }
  const card = ev.target.closest && ev.target.closest('.mc.edit'); if (!card) return;
  const dir = {ArrowLeft:-1, ArrowUp:-1, ArrowRight:1, ArrowDown:1}[ev.key]; if (!dir) return;
  ev.preventDefault();
  const k = card.dataset.bkey, a = BOARD.shown.slice(), i = a.indexOf(k), j = i + dir; if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; saveBoard(a); render();
  const n = document.querySelector(`[data-bkey="${k}"]`); if (n) n.focus();
});
init();
</script>
